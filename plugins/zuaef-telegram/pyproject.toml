[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zuaef-telegram"
version = "0.1.0"
description = "ZUAEF outbound reporting plugin: one model-visible tool reports a concise message to one configured Telegram chat."
requires-python = ">=3.11"
# zuaef-agent itself is not on PyPI; install this package into the same
# environment that provides the zuaef_agent distribution (peer dependency).
dependencies = ["httpx>=0.28", "pydantic-ai>=2.27,<3"]

[project.entry-points."zuaef.plugins"]
telegram = "zuaef_telegram:create_plugin"

[tool.hatch.build.targets.wheel]
packages = ["zuaef_telegram"]

# Ship the deferred Skill guidance next to the package so wheel installs keep it.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"

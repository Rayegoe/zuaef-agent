[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zuaef-coding"
version = "0.1.0"
description = "Trusted repository coding composition for ZUAEF."
requires-python = ">=3.11"
dependencies = ["pydantic-ai>=2.38,<3", "pydantic-ai-harness[code-mode]>=0.29,<0.30"]

[project.entry-points."zuaef.plugins"]
coding = "zuaef_coding.plugin:build_plugin"

[tool.hatch.build.targets.wheel]
packages = ["zuaef_coding"]

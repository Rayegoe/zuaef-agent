[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zuaef-case"
version = "0.1.0"
description = "Business Case Agent plugin for ZUAEF v0.4: file-native BusinessCase / Situation / Trajectory objects under workspace/cases/."
requires-python = ">=3.11"
# zuaef-agent itself is not on PyPI; install this package into the same
# environment that provides the zuaef_agent distribution (peer dependency).
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0",
]

[project.entry-points."zuaef.plugins"]
case = "zuaef_case:create_plugin"

[tool.hatch.build.targets.wheel]
packages = ["zuaef_case"]

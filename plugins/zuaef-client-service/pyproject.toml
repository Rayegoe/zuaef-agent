[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zuaef-client-service"
version = "0.1.0"
description = "Client Service Decision Slice plugin for ZUAEF: retrieval, customer assessment, deterministic policy engine, response strategy, interaction receipts. No core changes (SPEC v0.1 §5.1)."
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai>=2.27,<3",
  "pydantic-ai-harness[skills]>=0.1",
  "pyyaml>=6.0",
]

[project.entry-points."zuaef.plugins"]
client-service = "zuaef_client_service.plugin:build_plugin"

[tool.hatch.build.targets.wheel]
packages = ["zuaef_client_service"]

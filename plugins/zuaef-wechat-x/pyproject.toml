[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zuaef-wechat-x"
version = "0.1.0"
description = "WeChat + X dual-rhythm writing engine: 公众号 short-form article and X thread from one material set, with plugin-shipped templates and the Machine & Soul corpus."
requires-python = ">=3.11"
dependencies = ["pydantic-ai>=2.38,<3"]

[project.entry-points."zuaef.plugins"]
wechat-x = "zuaef_wechat_x.plugin:create_plugin"

[tool.hatch.build.targets.wheel]
packages = ["zuaef_wechat_x"]

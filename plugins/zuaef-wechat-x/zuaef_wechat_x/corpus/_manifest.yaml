# ── Publishing Pipeline ───────────────────────────

pipeline:
  skill: wechat-x-publish
  account: 坐驰未来
  author: 片言
  slogan: 片言以通百意，坐驰以驭万景
  platforms:
    - wechat_public_account
    - x_twitter
  daily_topics:
    - ai-and-control
    - ai-and-identity
    - ai-and-attention
    - ai-and-work
    - ai-and-suffering
    - ai-and-freedom
    - ai-and-judgement
    - ai-and-meaning
    - ai-and-civilisation
    - ai-and-the-soul
  content_rhythm: daily
  style_notes:
    - alan_watts_as_style_reference_only_not_corpus
    - british_observer_voice
    - short_judgments_over_academic_exposition
    - 面向创业者/中小企业主，用短句，强节奏，有现实判断

copyright_policy:
  phase_one: public_domain_and_own_summaries_only
  avoid:
    - modern_translations_full_text
    - alan_watts_full_books_transcripts
    - SEP_full_pages
    - contemporary_philosophy_books_full_text
  always_check:
    - russell_copyright
    - wittgenstein_copyright
    - modern_translations_copyright
    - per_country_public_domain_rules

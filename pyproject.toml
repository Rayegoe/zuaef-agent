[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zuaef-agent"
version = "0.1.1"
description = "Thin outcome-owning PydanticAI agent core with bounded context, durable step receipts, native approval policy, and file-native knowledge."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "openai>=1.0",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "playwright>=1.61,<2",
  "pydantic-ai>=2.38,<3",
  # Minor-bound (ZUAEF-ASHARE-001 U006; harness-alignment v0.1 H013
  # PROMOTE_0_29): 0.x Harness may break API between minors; each bump runs
  # the compatibility lane gates before promotion.
  "pydantic-ai-harness[skills,code-mode]>=0.29,<0.30",
  # Agent Console (src/zuaef_agent/web): already in the closure via pydantic-ai's
  # mcp extra; declared because the console imports them directly (precedent:
  # pydantic-ai-slim's `web` extra = httpx/starlette/uvicorn).
  "starlette>=0.41",
  "uvicorn>=0.30",
  # Repository-local production plugins (uv workspace members, see
  # [tool.uv.workspace] below): `uv sync` installs them with their real
  # `zuaef.plugins` entry points so importlib.metadata discovery works on a
  # clean checkout. They are peers, not importers, of zuaef_agent.
  "zuaef-ace-writing",
  "zuaef-case",
  "zuaef-client-service",
  "zuaef-emtb-budget",
  "zuaef-wordpress",
  "zuaef-writing-pack",
  "zuaef-competitive-intelligence",
  "zuaef-telegram",
  "zuaef-quant",
  "lark-channel-sdk==1.4.0",
]

[project.scripts]
zuaef-agent = "zuaef_agent.cli:main"
chatgpt-handoff = "chatgpt_handoff.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
# ZUAEF-ASHARE-001 P0 (D001): real A-share market data lives in an isolated,
# opt-in group — production agent installs (`uv sync --frozen`) never carry it.
# Pin follows the audited release in the spec pack; P3 moves it into the
# zuaef-quant plugin package.
quant = ["akshare==1.18.94"]

[tool.uv.workspace]
# All production plugins live in-repo as workspace members; `uv sync --frozen`
# is the single install contract for them (real distributions + entry points).
members = ["plugins/*"]

[tool.uv.sources]
zuaef-ace-writing = { workspace = true }
zuaef-case = { workspace = true }
zuaef-client-service = { workspace = true }
zuaef-emtb-budget = { workspace = true }
zuaef-wordpress = { workspace = true }
zuaef-writing-pack = { workspace = true }
zuaef-competitive-intelligence = { workspace = true }
zuaef-telegram = { workspace = true }
zuaef-quant = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "src",
  "tests/fixture_plugins",
  # benchmark/legacy editorial-control capability (v1.2 T014B demotion):
  # imported only by editorial benchmark tests, never by production code
  "benchmarks/editorial-learning/legacy",
  ".",
]

[tool.ruff]
# `ruff check .` gates P2-7. These are committed trees outside the zuaef-agent
# delivery scope (installed third-party skill scripts, bmad workspace config,
# the separate editorial-control package overlay, the vendored qlib
# dump_bin ingestion script, and the feishu spec-pack reference material) —
# their lint health is owned upstream, so the product gate scans the delivery
# tree only.
exclude = [".agents", "_bmad", "zuaef-editorial-control-v0.1", "tools/quant/upstream", "zuaef-feishu-surface-spec-pack-v0.1"]

[tool.ruff.lint.per-file-ignores]
# E402: deliberate sys.path bootstrapping before importing the editable plugins
# (benchmark/experiment seam scripts and their tests import after sys.path[:0]).
"benchmarks/editorial-learning/**" = ["E402"]
"tests/*.py" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["src/zuaef_agent", "src/chatgpt_handoff"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zuaef-agent"
version = "0.1.1"
description = "Thin outcome-owning PydanticAI agent core with bounded context, durable step receipts, native approval policy, and file-native knowledge."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "openai>=1.0",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "pydantic-ai>=2.27,<3",
  "pydantic-ai-harness[skills,code-mode]>=0.1",
]

[project.scripts]
zuaef-agent = "zuaef_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "src",
  "tests/fixture_plugins",
  "plugins/zuaef-ace-writing",
  "plugins/zuaef-emtb-budget",
  "plugins/zuaef-client-service",
  "plugins/zuaef-writing-pack",
  # benchmark/legacy editorial-control capability (v1.2 T014B demotion):
  # imported only by editorial benchmark tests, never by production code
  "benchmarks/editorial-learning/legacy",
  ".",
]

[tool.ruff]
# `ruff check .` gates P2-7. These are committed trees outside the zuaef-agent
# delivery scope (installed third-party skill scripts, bmad workspace config,
# and the separate editorial-control package overlay) — their lint health is
# owned upstream, so the product gate scans the delivery tree only.
exclude = [
  ".agents",
  "_bmad",
  "zuaef-editorial-control-v0.1",
]

[tool.ruff.lint.per-file-ignores]
# E402: deliberate sys.path bootstrapping before importing the editable plugins
# (benchmark/experiment seam scripts and their tests import after sys.path[:0]).
"benchmarks/editorial-learning/**" = ["E402"]
"tests/*.py" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["src/zuaef_agent"]

# Production profile: bounded writing environment.
# Install: cp profiles/ace-writing.toml ~/.config/zuaef/profiles/ace-writing.toml
# (config root: $ZUAEF_CONFIG_ROOT, default ~/.config/zuaef). "ace-writing"
# must match the file name. Config keys are non-secret only.
schema = 1
name = "ace-writing"

[[plugins]]
id = "ace-writing"
allow_capabilities = false

[plugins.config]
# ACE root resolution (plugin order): explicit `ace_root` here -> $ACE_ROOT ->
# the compiled default (~/projects/article-context-engine/article-context-engine).
# Not pinned here so deployments can point ACE_ROOT at their checkout.
# ace_root = "~/projects/article-context-engine/article-context-engine"

# Editorial control was removed from the production surface in v1.2 T014B:
# no stable advantage in the Phase 9 blind A/B, and a machine veto on taste
# is forbidden as semantic authority. Any editorial_* key now fails
# composition; the capability is benchmark/legacy only under
# benchmarks/editorial-learning/legacy/.

# Optional file-native human-edit corpus. By default the plugin uses the
# sibling ``learning/`` directory beside the configured workspace root.
# learning_root = "./learning"

# Example profile: ACE Writing plugin (SPEC §34 + editorial control v0.1).
# Install: cp profiles/ace-writing.toml ~/.config/zuaef/profiles/ace-writing.toml
# (config root: $ZUAEF_CONFIG_ROOT, default ~/.config/zuaef). "ace-writing"
# must match the file name. Config keys are non-secret only.
schema = 1
name = "ace-writing"

[[plugins]]
id = "ace-writing"
# Required for the editorial-control capability (plugin returns a capability
# only when editorial_control = true; the composition layer rejects
# capabilities without this flag).
allow_capabilities = true

[plugins.config]
# Explicit config wins over ACE_ROOT / the compiled default path.
ace_root = "~/projects/article-context-engine/article-context-engine"

# --- Editorial control (SPEC zuaef-editorial-control-v0.1) ---
editorial_control = true
editorial_max_injections = 4        # normal interventions per run
editorial_max_save_vetoes = 1       # save_artifact rejections per run
editorial_evidence_limit = 3        # evidence refs per intervention
editorial_veto_threshold = 1.50     # combined drift score that triggers a veto
editorial_temperature_nudge = 0.0   # 0.0 = sampling untouched (default)
# Optional overrides:
# editorial_evidence_path = "~/.config/zuaef/editorial/evidence.jsonl"
# editorial_base_temperature = 0.7

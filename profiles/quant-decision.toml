# Quant-decision profile (ZUAEF-ASHARE-001 Z005 / Phase 2 v0.1): the
# zuaef-quant plugin (QuantDecision Capability domain surface) plus the
# zuaef-telegram plugin (report_to_telegram approval-gated;
# send_artifact_to_supervisor host-scoped operator self-delivery).
# Non-secret config only; the side-environment python is resolved from
# ZUAEF_QUANT_PYTHON or the repo default .venv-quant; telegram credentials
# come from TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID in the local environment.
# Install: cp profiles/quant-decision.toml ~/.config/zuaef/profiles/
schema = 1
name = "quant-decision"

# Harness resource request (quant research service v0.2, T001): the effective
# authorization is host ceiling ∩ this request (composition layer freezes it).
# Host ceiling comes from ZUAEF_ENABLE_* in the deployment environment — a
# profile request alone never widens host policy.
# Memory / subagents / shell / repo_context stay unauthorized: market truth
# has durable business artifacts, not generic memory, and quant production
# stays a single outcome-owning agent.
# Core WebSearch/WebFetch stay OFF (2026-09-08 operator decision, deployed on
# OPi5 first, reconciled into the repo): the market-intelligence layer needs
# real-failure admission evidence before enabling — the quant research flow
# must not pay for "might help later" perception (capability admission rule).
[generalist]
web_search = false
web_fetch = false
tool_search = true
conversation_search = true
context_controls = true

[[plugins]]
id = "quant"
allow_capabilities = true

[plugins.config]
# Research sandbox: run_code over the evidence tools + read-only history
# cache mount, for throwaway analysis code (event studies, similar-history
# distributions, comparisons). Never edits strategy, ledger or candidates.
code_mode = true

[[plugins]]
id = "telegram"

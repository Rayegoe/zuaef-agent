schema = 1
name = "coding"

[generalist]
web_search = false
web_fetch = false
# ToolSearch/ConversationSearch off: single-purpose profile, no coding failure
# demonstrated a need (run aea67372 execution-discipline evidence, Spec v0.1 §7).
tool_search = false
memory = false
conversation_search = false
context_controls = true
subagents = false
# Plugin supplies both Shell roots with credential filtering; core Shell has none.
shell = false
repo_context = false

[[plugins]]
id = "coding"
allow_capabilities = true
defer_tools = false

[plugins.config]
# Explicit per-user checkout: Barry and OPi5 both deploy under ~/zuaef-agent.
repo_root = "~/zuaef-agent"
code_mode = false
allow_codex = false
allow_pi = false
allow_local_commit = true
output_language = "zh-CN"

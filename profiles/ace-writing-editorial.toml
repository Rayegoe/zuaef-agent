# Experimental profile: ace-writing WITH the editorial-control capability ON.
# Phase 9 blind A/B (2026-08): the OFF default beat this side on the anonymous
# sample, so editorial control stays OPTIONAL per SPEC §20. Use this profile
# only if you want to re-run the ON side yourself — it is not the production
# default and no further machine sensors will be added to try to "win".
schema = 1
name = "ace-writing-editorial"

[[plugins]]
id = "ace-writing"
allow_capabilities = true

[plugins.config]
editorial_control = true
editorial_max_injections = 4
editorial_max_save_vetoes = 1
editorial_evidence_limit = 3
editorial_veto_threshold = 1.50
editorial_temperature_nudge = 0.0